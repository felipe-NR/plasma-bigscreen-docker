# System-wide mpv settings for the Bigscreen session. Stremio hands streams
# to mpv when its external player is on, which is the HDR path: the embedded
# Stremio player has no HDR output. gpu-next and target-colorspace-hint=auto
# are already the defaults.

# Decode on the host GPU through VA-API.
hwdec=vaapi
fullscreen=yes
# Describe the output in the colorspace of the video. HDR streams then reach
# Hyprland as PQ and switch the TV to HDR, and SDR streams leave it in SDR.
target-colorspace-hint-mode=source
