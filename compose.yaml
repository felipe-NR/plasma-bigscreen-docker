# Fixed so the container and volume names do not depend on the folder name.
name: plasma-bigscreen-docker

services:
  bigscreen:
    build:
      context: .
      args:
        HTPC_UID: ${HTPC_UID:-1000}
        HTPC_GID: ${HTPC_GID:-1000}
    image: plasma-bigscreen-docker:latest
    container_name: plasma-bigscreen
    # Own network namespace on purpose: KWin binds an abstract X11 socket for
    # its Xwayland, and in the host namespace that socket captures DISPLAY=:0
    # from X11 apps on the host desktop.
    hostname: ${HTPC_HOSTNAME:?run scripts/setup-env.sh first}
    # Bound to the LAN address because Docker publishes ports ahead of ufw.
    ports:
      # KDE Connect: identity on 1716, file transfers on 1739 to 1764.
      - "${LAN_IP:?run scripts/setup-env.sh first}:1716:1716/tcp"
      - "${LAN_IP}:1716:1716/udp"
      - "${LAN_IP}:1739-1764:1739-1764/tcp"
      # Unified Remote.
      - "${LAN_IP}:9512:9512/tcp"
      - "${LAN_IP}:9511-9512:9511-9512/udp"
    shm_size: 1g
    # kwin_wayland ships with the cap_sys_nice file capability for realtime
    # scheduling. The kernel refuses to exec it unless the capability is in
    # the container's bounding set.
    cap_add:
      - SYS_NICE
    environment:
      LANG: ${HTPC_LANG:-en_US.UTF-8}
      TZ: ${HTPC_TZ:-UTC}
    group_add:
      - ${VIDEO_GID:?run scripts/setup-env.sh first}
      - ${RENDER_GID:?run scripts/setup-env.sh first}
    devices:
      - /dev/dri
    tmpfs:
      - /run/user/${HTPC_UID}:mode=0700,uid=${HTPC_UID},gid=${HTPC_GID}
    volumes:
      - ${HOST_RUNTIME_DIR}/${HOST_WAYLAND_DISPLAY}:/run/user/${HTPC_UID}/wayland-host
      - ${HOST_RUNTIME_DIR}/pulse/native:/run/user/${HTPC_UID}/pulse/native
      - ${HOST_RUNTIME_DIR}/pipewire-0:/run/user/${HTPC_UID}/pipewire-0
      - home:/home/htpc
      - ${MEDIA_DIR:-./media}:/media:ro

volumes:
  home:
